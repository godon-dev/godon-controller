name: controller
target: controller
workspace: godon

scripts:
  # Fast lane: the door and the reads - seconds-work only, never sharing a
  # lane with a long executor. 60s matches the api's sync budget.
  - pattern: "call_fast.sh"
    path: "wrappers"
    settings:
      summary: "Godon Controller"
      description: "Lifecycle verbs and the data layer - one generic entry, the verb rides the arguments"
      tag: "controller-fast"
      timeout: 60

  # Slow lane: the heavy halves - the create executor's table builds and the
  # delete's quiesce guard.
  - pattern: "call_slow.sh"
    path: "wrappers/executors"
    settings:
      summary: "Godon Controller Executors"
      description: "Slow halves of lifecycle operations - archive-DB table builds, quiesce-guarded deletes"
      tag: "controller-slow"
      timeout: 600

flows: []
