name: controller
target: controller
workspace: godon

scripts:
  # Fast lane: the door and the reads - seconds-work only, never sharing a
  # lane with a long executor. 60s matches the api's sync budget.
  - script: "systemtender_create"
    sandbox: "ghcr.io/godon-dev/godon-controller"
    tag_env: "CONTROLLER_VERSION"
    settings:
      summary: "Godon Controller"
      description: "Lifecycle verbs and the data layer - the fast lane's door and reads"
      tag: "controller-fast"
      timeout: 60
