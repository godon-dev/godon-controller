  - script: "credential_create"
    sandbox: "ghcr.io/godon-dev/godon-controller"
    tag_env: "CONTROLLER_VERSION"
    settings:
      summary: "Godon Controller"
      description: "Lifecycle verbs and the data layer - the fast lane's door and reads"
      tag: "controller-fast"
      timeout: 60
  - script: "credential_get"
    sandbox: "ghcr.io/godon-dev/godon-controller"
    tag_env: "CONTROLLER_VERSION"
    settings:
      summary: "Godon Controller"
      description: "Lifecycle verbs and the data layer - the fast lane's door and reads"
      tag: "controller-fast"
      timeout: 60
  - script: "credential_delete"
    sandbox: "ghcr.io/godon-dev/godon-controller"
    tag_env: "CONTROLLER_VERSION"
    settings:
      summary: "Godon Controller"
      description: "Lifecycle verbs and the data layer - the fast lane's door and reads"
      tag: "controller-fast"
      timeout: 60
  - script: "credentials_get"
    sandbox: "ghcr.io/godon-dev/godon-controller"
    tag_env: "CONTROLLER_VERSION"
