[package]
name = "godon-controller"
version = "0.59.26"
edition = "2021"
description = "The godon controller - lifecycle verbs and the data layer"

[lib]
name = "godon_controller"
path = "src/lib.rs"

[[bin]]
name = "godon-controller"
path = "src/main.rs"

[dependencies]
postgres = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "logs"] }
opentelemetry-appender-log = "0.33"
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
