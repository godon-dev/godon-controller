name: Controller Rust CI

# The controller's CI: fmt and cargo clippy gates ahead of the tests
# (per-PR), plus the mutants job — the test-discrimination instrument
# (dispatch/weekly only — measurement, not a gate). The suite runs on
# fakes, no database service needed.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # weekly, Monday 03:30 UTC — after the robots run
    - cron: '30 3 * * 1'

jobs:
  cargo-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --quiet

  mutants:
    if: github.event_name != 'pull_request'
    name: cargo mutants (controller)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Baseline (the suite must be green before breaking it)
        run: cargo test --quiet

      - name: cargo mutants
        run: cargo mutants --output mutants.out

      - name: Upload outcomes
        uses: actions/upload-artifact@v4
        with:
          name: mutants-outcomes
          path: mutants.out/
